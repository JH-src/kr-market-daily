name: kis
on:
  workflow_dispatch:
  push:
    paths: ['kis/trigger.txt']
  schedule:
    - cron: '41 6 * * 1-5'   # 평일 15:41 KST, 장 마감 직후(시간외 단일가 전) 종가 수집 + 1차 수급
    - cron: '20 7 * * 1-5'   # 평일 16:20 KST, 장 마감 후 1차
    - cron: '40 9 * * 1-5'   # 평일 18:40 KST, 수급 확정치 다시 받기
permissions:
  contents: write
concurrency:
  group: kis
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 한투 일별 수집(조회 전용)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          cd src
          # 1회성 작업(trigger.txt)은 push로 실행될 때만. 정기 실행은 항상 일별 수집(2026-10-23: 남은 trigger 때문에 정기 수집이 건너뛰어진 문제 수정)
          if [ "${{ github.event_name }}" = "push" ]; then
          if grep -q probe ../kis/trigger.txt 2>/dev/null; then python3 kis_probe.py; fi
          if grep -q frgnprobe ../kis/trigger.txt 2>/dev/null; then python3 frgn_probe.py; exit 0; fi
          if grep -q frgnnow ../kis/trigger.txt 2>/dev/null; then python3 kis_frgn_now.py; exit 0; fi
          if grep -q bondinfo ../kis/trigger.txt 2>/dev/null; then python3 kis_bond.py; exit 0; fi
          if grep -q speed ../kis/trigger.txt 2>/dev/null; then python3 kis_speed.py; exit 0; fi
          if grep -q etfall ../kis/trigger.txt 2>/dev/null; then python3 kis_etf_all.py; exit 0; fi
          if grep -q stockinfo ../kis/trigger.txt 2>/dev/null; then python3 kis_stockinfo.py; exit 0; fi
          if grep -q idxdaily ../kis/trigger.txt 2>/dev/null; then python3 kis_idx_daily.py; exit 0; fi
          if grep -q fundshist ../kis/trigger.txt 2>/dev/null; then python3 kis_funds_hist.py; exit 0; fi
          fi
          D=""; [ "${{ github.event_name }}" = "push" ] && D=$(grep -o "date=[0-9]*" ../kis/trigger.txt | cut -d= -f2)
          python3 kis_eod.py $D || echo "eod 실패"
          if [ "${{ github.event_name }}" = "push" ] && grep -q eodonly ../kis/trigger.txt 2>/dev/null; then exit 0; fi
          python3 kis_daily.py
          if [ "$(date -u +%H)" = "09" ]; then python3 kis_frgn_now.py || echo '보유비율 생략'; fi
      - name: 결과 저장
        run: |
          git config user.name "kis-bot"; git config user.email "kis-bot@users.noreply.github.com"
          git add data/kis && git commit -m "한투 일별 수집" || echo nothing
          git pull --rebase -q && git push
