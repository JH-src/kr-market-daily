name: watchdog
# 자동 탐색(sim)이 멈추지 않게 지킨다: 매시간 확인해 실행 중이거나 대기 중인 회차가 없으면 새로 시작.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 자동 탐색 상태 확인·재시작
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          active=$(gh api "repos/$REPO/actions/workflows/sim.yml/runs?per_page=10" --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length')
          last=$(gh api "repos/$REPO/actions/workflows/sim.yml/runs?per_page=1" --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.created_at)"')
          echo "진행 중 $active / 최근 $last"
          if [ "$active" = "0" ]; then
            gh workflow run sim.yml -R "$REPO" && echo "재시작함"
          fi
