name: sim
# 로직 자동 탐색·검증을 쉬지 않고 돌린다(토큰 미사용). 6시간마다 새로 시작해 누적 결과에 이어 붙인다.
on:
  workflow_dispatch:
  push:
    paths: ['sim/trigger.txt']
  schedule:
    - cron: '30 */6 * * *'
permissions:
  contents: write
concurrency:
  group: sim
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: 준비
        run: pip install -q pandas numpy tabulate
      - name: 판단 재료 표 만들기
        env:
          SIM_CACHE: /tmp/simcache
        run: |
          mkdir -p /tmp/simcache
          cd src
          python3 -c "from sim import data as D; D.prices(refresh=True)"
          python3 -m sim.panel coarse ksic3
          python3 -m sim.enrich
          python3 -m sim.enrich_flows || echo "수급 지표 생략"
      - name: 진행 표시(판단 재료 완료)
        run: |
          git config user.name "sim-bot"; git config user.email "sim-bot@users.noreply.github.com"
          echo "run ${{ github.run_number }} 판단 재료 완료 $(TZ=Asia/Seoul date '+%F %H:%M')" > sim_state/status.txt
          git add sim_state/status.txt && git commit -q -m "자동 탐색 진행 표시" && (git pull --rebase -q && git push) || true
      - name: 탐색(약 4시간)
        env:
          SIM_CACHE: /tmp/simcache
          SIM_STATE: ${{ github.workspace }}/sim_state
        run: |
          cd src
          timeout 15000 python3 -m sim.search 14000 ${{ github.run_number }} || true
      - name: 결과 저장
        run: |
          git config user.name "sim-bot"; git config user.email "sim-bot@users.noreply.github.com"
          git add sim_state docs/sim/search.md && git commit -q -m "로직 자동 탐색 누적 결과" || echo nothing
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
