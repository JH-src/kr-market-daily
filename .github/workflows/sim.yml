name: sim
# 로직 자동 탐색·검증을 쉬지 않고 돌린다(토큰 미사용). 4시간마다 새로 시작해 누적 결과에 이어 붙인다.
on:
  workflow_dispatch:
  push:
    paths: ['sim/trigger.txt']
  schedule:
    - cron: '15 */4 * * *'
permissions:
  contents: write
concurrency:
  group: sim
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: 준비
        run: pip install -q pandas numpy tabulate
      - name: 판단 재료 표 만들기
        env:
          SIM_CACHE: /tmp/simcache
        run: |
          mkdir -p /tmp/simcache
          cd src
          python3 -c "from sim import data as D; D.prices(refresh=True)"
          python3 -m sim.panel coarse ksic3 theme
          python3 -m sim.enrich
          python3 -m sim.enrich_flows || echo "수급 지표 생략"
      - name: 진행 표시(판단 재료 완료)
        run: |
          git config user.name "sim-bot"; git config user.email "sim-bot@users.noreply.github.com"
          echo "run ${{ github.run_number }} 판단 재료 완료 $(TZ=Asia/Seoul date '+%F %H:%M')" > sim_state/status.txt
          git add sim_state/status.txt && git commit -q -m "자동 탐색 진행 표시" && (git pull --rebase -X theirs -q && git push) || true
      - name: 탐색(약 4시간)
        env:
          SIM_CACHE: /tmp/simcache
          SIM_STATE: /tmp/newstate
        run: |
          mkdir -p /tmp/newstate && cp sim_state/search_*_v2* /tmp/newstate/ 2>/dev/null || true
          cd src
          pip install -q tabulate 2>/dev/null || true
          timeout 1500 python3 -m sim.factors > /tmp/factors.log 2>&1 || tail -20 /tmp/factors.log
          tail -3 /tmp/factors.log
          cp ../docs/sim/factors.md /tmp/factors.md 2>/dev/null || true
          timeout 11500 python3 -m sim.search 9500 ${{ github.run_number }} || true
      - name: 결과 저장
        run: |
          git config user.name "sim-bot"; git config user.email "sim-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            (cd src && SIM_CACHE=/tmp/simcache python3 -m sim.merge_state /tmp/newstate ../sim_state)
            cp /tmp/factors.md docs/sim/factors.md 2>/dev/null || true; git add sim_state docs/sim/search.md docs/sim/factors.md && git commit -q -m "로직 자동 탐색 누적 결과" || break
            git push && break; sleep 10
          done
